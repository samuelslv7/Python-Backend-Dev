[project]
name = "dio-bank"
version = "0.1.0"
description = "Banco do curo python da DIO"
authors = [
    {name = "Samuel Silva",email = "samuelslv7@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "flask (>=3.0.0)",
    "flask-sqlalchemy (>=3.1.0)",
    "flask-migrate",
    "flask-jwt-extended (>=4.5.0)",
    "jinja2",
    "pytest",
    "pytest-mock"
]


[pytest]
addopts = ["-vvv"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
